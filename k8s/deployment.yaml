# Manager: kubernetes. Its default managerFilePatterns is EMPTY, so this file is
# invisible to Renovate until you configure the pattern (see renovate.json).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uv-demo
  template:
    metadata:
      labels:
        app: uv-demo
    spec:
      containers:
        - name: uv
          image: ghcr.io/astral-sh/uv:0.12.7-trixie-slim@sha256:92d38da241c7962f8f863e288cc1c39795b79b6553245f623a82db6be95bdae0
          command: ["uv", "--version"]
