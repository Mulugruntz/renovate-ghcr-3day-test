name: Renovate (self-hosted A/B)

# Proof of concept for the dockerMaxPages finding.
#
# Run it twice from the Actions tab and compare the logs:
#
#   docker_max_pages = 0   -> leaves the option UNSET (Renovate default: 20 pages)
#                             Docker Hub 403s on page 11 for astral/uv (5448 tags),
#                             Renovate falls back to the timestamp-less registry API,
#                             every release is "pending" => no Docker PRs.
#
#   docker_max_pages = 10  -> stops exactly at Docker Hub's anonymous 1000-item cap.
#                             Timestamps arrive, the 3-day cooldown is evaluated
#                             properly, and astral/uv gets a real PR with tag+digest.
#
# What to grep for in the job log:
#   "error fetching data from DockerHub"     <- the 403 fallback (the bug)
#   "Marking N release(s) as pending"        <- no timestamps were available
#   "pendingChecks"                          <- update withheld
#   "0.12.14-trixie-slim"                    <- the aged-out version being chosen (the fix)

on:
  workflow_dispatch:
    inputs:
      docker_max_pages:
        description: 'dockerMaxPages. Use 10 for the fix, or 0 to leave it unset and reproduce the bug.'
        type: string
        default: '10'
      dry_run:
        description: 'Dry run: read config and enumerate updates, create NO PRs.'
        type: boolean
        default: true

# Least privilege for a single-repo run. contents+pull-requests to push branches
# and open PRs, issues for the Dependency Dashboard.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate-selfhosted
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: Renovate clones the repo itself.

      # Set RENOVATE_* vars via $GITHUB_ENV rather than the step's `env:` block.
      # The action forwards anything matching its default env-regex
      # ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|...)$
      # into the container, and an empty string is an INVALID value for several
      # options -- so omit the variable entirely instead of blanking it.
      - name: Configure dockerMaxPages
        if: ${{ inputs.docker_max_pages != '0' }}
        run: echo "RENOVATE_DOCKER_MAX_PAGES=${{ inputs.docker_max_pages }}" >> "$GITHUB_ENV"

      - name: Enable dry run
        if: ${{ inputs.dry_run }}
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: debug
          # Scope the run to this repo only; no autodiscover needed.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # RENOVATE_DOCKER_MAX_PAGES and RENOVATE_DRY_RUN are inherited from
          # $GITHUB_ENV above, and only when actually set.
