name: Renovate (self-hosted A/B)

# Proof of concept for the dockerMaxPages finding.
#
# Run twice from the Actions tab and compare:
#   docker_max_pages = 0   -> option UNSET (Renovate default 20 pages). Docker Hub
#                             403s at page 11 for astral/uv (5448 tags), Renovate
#                             falls back to the timestamp-less registry API, every
#                             release is "pending" => no Docker PRs.
#   docker_max_pages = 10  -> stops at Docker Hub's anonymous 1000-item cap.
#                             Timestamps arrive, the 3-day cooldown is evaluated,
#                             astral/uv gets a real PR with tag AND digest bumped.
#
# Log strings worth grepping:
#   "error fetching data from DockerHub"   <- the 403 fallback (the bug)
#   "0.12.14-trixie-slim"                 <- aged-out version chosen (the fix)
#   "Pull request creation error"         <- PR API refused
#   "prBlockedBy"                         <- Renovate declined to open the PR

on:
  workflow_dispatch:
    inputs:
      docker_max_pages:
        description: 'dockerMaxPages. 10 = the fix; 0 = leave unset and reproduce the bug.'
        type: string
        default: '10'
      dry_run:
        description: 'Dry run: enumerate updates, create NO branches or PRs.'
        type: boolean
        default: false

# Renovate uses the GitHub App token below, not GITHUB_TOKEN, so the job's own
# token needs nothing. The App installation carries contents/PR/issues/workflows.
permissions: {}

concurrency:
  group: renovate-selfhosted
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: Renovate clones the repo itself.

      # Set RENOVATE_* via $GITHUB_ENV rather than the step's `env:` block. The
      # action forwards anything matching its default env-regex
      #   ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|...)$
      # and an empty string is an INVALID value for several options, so omit the
      # variable entirely instead of blanking it.
      - name: Configure dockerMaxPages
        if: ${{ inputs.docker_max_pages != '0' }}
        run: echo "RENOVATE_DOCKER_MAX_PAGES=${{ inputs.docker_max_pages }}" >> "$GITHUB_ENV"

      - name: Enable dry run
        if: ${{ inputs.dry_run }}
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Optional: lets Renovate read github.com releases/changelogs for repos
          # the App is not installed on (e.g. astral-sh/uv for the LANE C lookup).
          # GITHUB_COM_TOKEN: ${{ secrets.GH_COM_READ_TOKEN }}
